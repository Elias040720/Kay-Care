# Reenvío al backend. Host = host del upstream (necesario para el enrutamiento
# interno de Container Apps); el host público viaja en X-Forwarded-Host.
proxy_http_version 1.1;
proxy_set_header Host $proxy_host;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Proto $kcf_forwarded_proto;
proxy_set_header X-Forwarded-Port $server_port;
# Se sobrescribe (no se concatena) para que el cliente no pueda falsear su IP.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Request-Id $request_id;
proxy_connect_timeout 5s;
proxy_read_timeout 30s;
proxy_send_timeout 30s;
proxy_hide_header X-Powered-By;
